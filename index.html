<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4murai Player</title>
    <!-- Biblioteka Supabase do obsługi bazy danych -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #ff4757;
        }
        .player-box {
            width: 100%;
            height: 400px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border-radius: 4px;
            color: #777;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #ff6b81;
        }
        input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2b2b2b;
            color: white;
            width: 80px;
            text-align: center;
        }
        .episode-list {
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        .episode-item {
            padding: 8px;
            background: #2b2b2b;
            margin-bottom: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .episode-item:hover {
            background: #3d3d3d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>S4murai Player</h1>
        
        <div class="player-box" id="videoContainer">
            Wybierz odcinek, aby odtworzyć
        </div>

        <div class="controls">
            <div>
                <label for="epInput">Odcinek nr: </label>
                <input type="number" id="epInput" min="1" value="1">
                <button onclick="loadEpisode()">Skocz do odcinka</button>
            </div>
            <div id="statusText" style="color: #2ed573; font-size: 14px;">Łączenie z bazą...</div>
        </div>

        <h3>Lista odcinków</h3>
        <div class="episode-list" id="episodeList">
            <!-- Tutaj będą ładować się odcinki -->
        </div>
    </div>

    <script>
        // Konfiguracja połączenia z Supabase
        const SUPABASE_URL = 'https://sodicdqwfxcijakgsdspb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zea9GDv7bDpjDCHgDKNazQ_6240ZBp7';

        // Inicjalizacja klienta Supabase
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const statusText = document.getElementById('statusText');

        // Test połączenia z bazą i pobranie danych
        async function testConnection() {
            try {
                // Przykładowe zapytanie sprawdzające połączenie (zakłada istnienie tabeli 'episodes' lub innej)
                // Jeśli tabela jeszcze nie istnieje, zmieni się tylko komunikat o statusie
                const { data, error } = await _supabase.from('episodes').select('*').limit(1);
                
                if (error) {
                    statusText.innerText = "Połączono z Supabase (brak tabeli episodes)";
                } else {
                    statusText.innerText = "Połączono pomyślnie z bazą danych!";
                    console.log("Dane z bazy:", data);
                }
            } catch (err) {
                console.error("Błąd połączenia:", err);
                statusText.innerText = "Błąd połączenia z bazą";
                statusText.style.color = "#ff4757";
            }
        }

        function loadEpisode() {
            const epNum = document.getElementById('epInput').value;
            const container = document.getElementById('videoContainer');
            container.innerText = `Odtwarzanie odcinka numer: ${epNum}`;
        }

        // Uruchomienie testu połączenia po załadowaniu strony
        testConnection();
    </script>
</body>
</html>
